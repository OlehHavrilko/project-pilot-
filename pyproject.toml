[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot"
version = "0.1.0"
description = "Agent that drives Windows from WSL, records video with live voiceover"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.setuptools]
# win_bridge runs as plain scripts on Windows and is deployed by a copy, not installed.
packages = ["perception"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live Windows bridge, OBS, API keys or open programs",
]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# The bridge runs as plain scripts on Windows (win_bridge is the working directory),
# so its modules import each other without the package prefix.
"win_bridge/*.py" = ["I001"]
